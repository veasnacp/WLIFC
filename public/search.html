<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Shipment Form - WL Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-red: #f87171;
            --brand-blue: lch(66.75% 48.95 274.13);
            --brand-green: #4ade80;
            --blue-pen: #18181a;
            /*--blue-pen: #2563eb;*/
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        #loggingCode:hover {
            color: #2563eb;
            text-decoration: underline !important;
        }

        /* Control Panel */
        #control-panel {
            position: sticky;
            top: 20px;
            /* position: fixed;
            left: 20px; */
            background: white;
            padding: 20px;
            margin: 40px 0;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 1000;
            width: 320px;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* if smaller than 1144 */
        @media screen and (max-width: 1144px) {
            #main {
                flex-direction: column;
                align-items: center;
            }
            #control-panel {
                /* position: fixed;
                top: 20px;
                left: 20px; */
                position: relative;
                margin: 0;
            }
        }

        /* Modal Styles */
        #batch-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #4b5563;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--brand-blue);
        }

        .btn-fetch {
            background-color: var(--brand-blue);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-icon {
            padding: 10px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #4b5563;
            transition: all 0.2s;
            position: relative;
        }

        .btn-icon:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .tooltip {
            visibility: hidden;
            width: 140px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -70px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 10px;
        }

        .btn-print {
            background-color: #1f2937;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        #logging {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #4b5563;
            max-height: 150px;
            overflow-y: auto;
            .btn-print {
                margin-top: 8px;
                padding: 6px 12px;
                font-size: 0.75rem;
                background-color: #2563eb;
            }
        }

        /* Form Layout Styling */
        .page-container {
            width: 210mm;
            min-height: 297mm;
            padding: 4mm;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 0;
            margin: 40px 0;
        }
        /* Each shipment page wrapper */
        .shipment-page {
            width: 100%;
            height: 300mm; /* Leave room for padding */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-after: always;
        }

        .shipment-page:last-child {
            page-break-after: auto;
        }

        .form-section {
            width: 100%;
            background: white;
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-grow: 1;
            max-height: 90mm;
        }

        .cut-line {
            border-top: 1.5px dashed #666;
            width: 100%;
            margin: 1px 0;
        }

        .header-bar {
            padding: 8px 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.4rem;
            color: white !important;
            -webkit-print-color-adjust: exact;
        }

        .bg-soft-blue { background-color: var(--brand-blue) !important; }
        .bg-soft-red { background-color: var(--brand-red) !important; }
        .bg-soft-green { background-color: var(--brand-green) !important; }

        .stroke-soft-blue-fix { stroke: #18181a !important; }
        .stroke-soft-blue { stroke: var(--brand-blue) !important; }
        .stroke-soft-red { stroke: var(--brand-red) !important; }
        .stroke-soft-green { stroke: var(--brand-green) !important; }

        .container-box {
            background: white;
            color: black;
            padding: 2px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.1rem;
            height: 34px;
        }

        .container-value {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: var(--blue-pen);
            min-width: 40px;
            outline: none;
        }

        .grid-cell {
            border-bottom: 1.5px solid #000;
            border-right: 1.5px solid #000;
            padding: 8px 12px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .no-right-border { border-right: none !important; }

        .label-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
            width: 42%;
            gap: 4px;
        }

        .col-span-3 {
            .label-group {
                width: 44%;
            }
        }

        .label-km { font-size: 0.9rem; color: #000; font-weight: 700; line-height: 1.1; }
        .label-zh { font-size: 0.8rem; color: #444; line-height: 1.1; }

        .value-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--blue-pen);
            text-align: center;
            flex-grow: 1;
            outline: none;
        }

        [data-field="billNumber"] {
            font-size: 1rem;
        }

        [data-field=container-splitting] {
            font-size: 0.8rem;
            /*color: #748fc7;*/
            color: #38383b;;
            margin-left: 4px;
        }

        [data-field="itemName"], [data-field="customerCode"]{
            font-size: 1rem;
        }

        .sideways-lines {
            width: 35px;
            background: linear-gradient(to bottom, transparent 95%, #eee 100%);
            background-size: 100% 35px;
            border-right: 1.5px solid #000;
        }

        .signature-area {
            display: flex;
            border-top: 2px solid #000;
            flex-grow: 1;
        }

        .signature-box {
            border-right: 1.5px solid #000;
            flex: 1;
            gap: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 100px;
        }

        .signature-line {
            border-bottom: 1.5px dashed #444;
            margin-top: auto;
            margin-bottom: 5px;
            width: 100%;
        }

        .editable-field:hover { background-color: rgba(37, 99, 235, 0.05); cursor: text; }
        .editable-field:focus { outline: 1px dashed var(--brand-blue); background-color: rgba(96, 165, 250, 0.1); }

        @media print {
            body { background: white; padding: 0; margin: 0; }
            #control-panel, #batch-modal { display: none !important; }
            .page-container {
                box-shadow: none;
                padding: 0;
                width: 210mm;
                margin: 0;
            }
            .shipment-page {
                height: 297mm;
                padding: 4mm;
            }
            #totalPriceWarning {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="main" class="flex items-start gap-4">
        <!-- Control Panel -->
        <div id="control-panel">
            <div class="flex gap-2 items-end relative">
                <!-- <div class="absolute -top-2 -right-2">
                    <button><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-chevron-right-icon lucide-circle-chevron-right"><circle cx="12" cy="12" r="10"/><path d="m10 8 4 4-4 4"/></svg></button>
                </div> -->
                <div class="input-group flex-1">
                    <label class="input-label">Shipment Code</label>
                    <div class="relative">
                        <input type="text" id="shipmentCode" class="input-field" placeholder="Enter code..." value="260320092946">
                        <button title="Paste from clipboard" onclick="pasteFromClipboard()" class="absolute top-3 right-2 w-5 flex items-center justify-end text-green-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clipboard-copy-icon lucide-clipboard-copy"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M16 4h2a2 2 0 0 1 2 2v4"/><path d="M21 14H11"/><path d="m15 10-4 4 4 4"/></svg></button>
                    </div>
                </div>
                <button onclick="toggleModal(true)" class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-plus-icon lucide-copy-plus"><line x1="15" x2="15" y1="12" y2="18"/><line x1="12" x2="18" y1="15" y2="15"/><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    <span class="tooltip">Update multiple data</span>
                </button>
            </div>

            <button id="fetchBtn" onclick="handleSingleFetch()" class="btn-fetch">Update Form</button>
            <div class="text-[10px] text-gray-400 text-center italic">Editable fields will sync across colored forms on the same page.</div>
            <hr class="my-1 border-gray-100">
            <button onclick="window.print()" class="btn-print">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                Print Documents
            </button>
            <div id="logging"></div>
        </div>

        <!-- Batch Modal -->
        <div id="batch-modal" onclick="if(event.target === this) toggleModal(false)">
            <div class="modal-content">
                <h2 class="text-xl font-bold mb-4">Batch Shipment Import</h2>
                <div class="input-group mb-4">
                    <label class="input-label">Multiple Codes (One per line)</label>
                    <textarea id="batchCodes" class="input-field h-40 font-mono" placeholder="260320092946&#10;260320092947&#10;..."></textarea>
                </div>
                <div class="flex gap-3 justify-end">
                    <button onclick="toggleModal(false)" class="px-4 py-2 text-gray-600 font-semibold">Cancel</button>
                    <button id="batchUpdateBtn" onclick="handleBatchFetch()" class="btn-fetch px-6">Update All Forms</button>
                    <button id="stopBatchBtn" onclick="handleStopBatchFetch()" class="btn-fetch px-6 bg-red-500 hidden">Stop</button>
                </div>
            </div>
        </div>

        <!-- Main Container for A4 -->
        <div id="main-content" class="page-container">
            <!-- Shipment pages will be injected here -->
        </div>
    </div>

    <script>
        /**
         * Mock Async Fetch Function
         */
        async function fetchData(code) {
            code = code.replace(/[^\d\n]/g, '').trim()

            return fetch(`/wl/${code}`, {
                method: 'GET',
                headers: {
                    "accept": "*/*",
                    "accept-language": "en-US,en;q=0.9",
                    'Content-Type': 'application/json'
                }
            })
                .then(async res => {
                    if (!res.ok) {
                        throw new Error(`Network response was not ok for code: ${code} - Status: ${res.status}`);
                    }
                    const data = await res.json();
                    if (!data || data.errorCode || data.message === 'failed') {
                        throw new Error(`Error in response data for code: ${code} - ${data ? data.message || 'Unknown error' : 'No data returned'}`);
                    } else {
                        log('✅', code);
                    }
                    return data;
                })
                .catch(err => {
                    console.error(err);
                    log('❌', code);
                    return { errorCode: 1, message: err.message};
                });
        }

        // resolve fetch when longer than 10s to prevent hanging
        async function fetchWithTimeout(code, timeout = 10000) {
            return Promise.race([
                fetchData(code),
                new Promise((_, reject) => setTimeout(() => {
                    return reject(new Error(`Fetch timed out for code: ${code}`))
                }, timeout))
            ]);
        }
        var loaded = false;
        var cache = {
            logging: {},
        };
        var globalVariables = {
            isStoppingBatch: false,
        };
        function log(message, code) {
            cache.logging[code] = `${message} ${code}`;
            // add button to clear logs
            document.getElementById('logging').innerHTML = Object.values(cache.logging).map(log => {
                if(log.startsWith('✅')) {
                    code = log.split(' ')[1];
                    log = `<a id="loggingCode" href="#${code}">${log}</a>`;
                }
                return `<div>${log}</div>`;
            }).join('') + `<div class="flex items-center justify-between"><button onclick="clearLogs()" class="btn-print">Clear</button><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="loadingFetch" class="animate-spin mr-4 text-blue-500 hidden lucide lucide-loader-circle-icon lucide-loader-circle"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>`;
        }
        function clearLogs() {
            cache.logging = {};
            document.getElementById('logging').innerHTML = Object.values(cache.logging).map(log => `<div>${log}</div>`).join('');
        }
        async function fetchLogisticsData(code) {
            if (loaded) {
                return fetchWithTimeout(code);
            }
            loaded = true;
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve({
                        dataExcel: `3.21A\tCustomer ID\t${code}\t2026-03-20\tItem Name\t10\t120.5\t1.5\t1.5`,
                        splitting: ['3','2','3'],
                        data: {
                            total: (Math.random() * 200 + 50).toFixed(2),
                            chargeable_volume: (Math.random() * 5 + 1).toFixed(3),
                        }
                    });
                }, 400);
            });
        }

        /**
         * Utility for chunking array for parallel processing
         */
        async function processInChunks(array, chunkSize, processor, callback=(result) => {}) {
            const results = [];
            for (let i = 0; i < array.length; i += chunkSize) {
                if(globalVariables.isStoppingBatch) break;
                const chunk = array.slice(i, i + chunkSize);
                const chunkResults = await Promise.all(chunk.map(item => {
                    const result = processor(item);
                    callback(result, item);
                    return result;
                }));
                results.push(...chunkResults);
                // sleep for 500ms between chunks to avoid overwhelming the server
                await new Promise(res => setTimeout(res, 500));
            }
            return results;
        }

        /**
         * Page Template Generator
         */
        function createShipmentPageHtml(fields, shipmentId) {
            const themes = [
                { bg: 'bg-soft-blue', stroke: 'stroke-soft-blue' },
                { bg: 'bg-soft-red', stroke: 'stroke-soft-red' },
                { bg: 'bg-soft-green', stroke: 'stroke-soft-green' }
            ];

            let sectionsHtml = '';
            themes.forEach((theme, idx) => {
                sectionsHtml += `
                <div class="form-section" id="${idx === 0 ? fields.billNumber : ""}">

                        <div class="flex items-center">

                                </svg>
                            </div>
                            <span style="font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-weight: 700;${idx === 0 ? 'color: #18181a;' : ''}">WL 疗诚国际货运公司</span>
                        </div>
                        <div class="container-box">
                            <span class="font-bold">ទូរ:</span>
                            <span class="container-value editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="container">${fields.container}</span>
                        </div>
                    </div>
                    <div class="flex flex-1">
                        <div class="sideways-lines"></div>
                        <div class="relative flex-1 grid grid-cols-11">
                            <div class="grid-cell col-span-4">
                                <div class="label-group"><span class="label-km">លេខបុង</span><span class="label-zh">体积描述</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="billNumber">${fields.billNumber}</div>
                            </div>
                            <div class="grid-cell col-span-4">
                                <div class="label-group"><span class="label-km">លេខអតិថិជន</span><span class="label-zh">客户代码</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="customerCode">${fields.customerCode}</div>
                            </div>
                            <div class="grid-cell col-span-3 no-right-border">
                                <div class="label-group"><span class="label-km">ទឹកប្រាក់សរុប</span><span class="label-zh">费用合计</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="totalPrice">$ ${fields.totalPrice}</div>
                                ${fields.totalPrice.includes("|") ? `<div id="totalPriceWarning" class="absolute top-0 right-0">
                                    <div class="bg-red-500/30 text-black" role="alert">
                                        <p class="text-xs">សូមពិនិត្យទឹកប្រាក់ម្តងទៀត</p>
                                    </div>
                                </div>` : ""}
                            </div>
                            <div class="grid-cell col-span-4">
                                <div class="label-group"><span class="label-km">ឈ្មោះទំនិញ</span><span class="label-zh">货物品名</span></div>
                                <div class="value-text editable-field line-clamp-2 ${fields.itemName.length > 20 ? ' text-[0.8rem]' : ""}" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="itemName">${fields.itemName}</div>
                            </div>
                            <div class="grid-cell col-span-4">
                                <div class="label-group"><span class="label-km">ចំនួនកញ្ចប់</span><span class="label-zh">件数</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="quantity">${fields.quantity}${fields.splitting.length && fields.splitting.length <= 5 ? `<span data-field="container-splitting">(${fields.splitting})</span>` : ''}</div>
                            </div>
                            <div class="grid-cell col-span-3 no-right-border">
                                <div class="label-group"><span class="label-km">ថ្លៃដឹកជញ្ជូន</span><span class="label-zh">交货价格</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="deliveryPrice"></div>
                            </div>
                            <div class="grid-cell col-span-4 border-b-0">
                                <div class="label-group"><span class="label-km">ម៉ែត្រគូប</span><span class="label-zh">体积 (m³)</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="volume">${fields.volume}</div>
                            </div>
                            <div class="grid-cell col-span-4 border-b-0">
                                <div class="label-group"><span class="label-km">ទម្ងន់</span><span class="label-zh">重量 (kg)</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="weight">${fields.weight}</div>
                            </div>
                            <div class="grid-cell col-span-3 no-right-border border-b-0">
                                <div class="label-group"><span class="label-km">សរុប</span><span class="label-zh">总计</span></div>
                                <div class="value-text editable-field" contenteditable="true" onkeydown="return event.key !== 'Enter';" data-shipment="${shipmentId}" data-field="total"></div>
                            </div>
                        </div>
                    </div>
                    <div class="signature-area">
                        <div class="signature-box">
                            <div class="label-km">អ្នកចេញទំនិញ</div><div class="label-zh">发货人签字</div>
                            <div class="signature-line"></div>
                        </div>
                        <div class="signature-box">
                            <div class="label-km">អ្នកទទួលទំនិញ</div><div class="label-zh">收货人签字</div>
                            <div class="signature-line"></div>
                        </div>
                        <div class="signature-box border-r-0">
                            <div class="label-km">អ្នកពិនិត្យទំនិញ</div><div class="label-zh">检查员签字</div>
                            <div class="signature-line"></div>
                        </div>
                    </div>
                </div>
                ${idx < themes.length - 1 ? '<div class="cut-line"></div>' : ''}
                `;
            });

            return `<div class="shipment-page">${sectionsHtml}</div>`;
        }

        /**
         * Handlers
         */
        function toggleModal(show) {
            document.getElementById('batch-modal').style.display = show ? 'flex' : 'none';
            // fucus textarea when opening modal
            if (show) {
                setTimeout(() => {
                    document.getElementById('batchCodes').focus();
                }, 100);
            }
        }

        async function handleSingleFetch() {
            const code = document.getElementById('shipmentCode').value.trim();
            if(!code) return alert("Enter a code");
            globalVariables.isStoppingBatch = false;

            const loadingIndicator = document.getElementById('loadingFetch');
            const btn = document.getElementById('fetchBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";
            if(loadingIndicator) loadingIndicator.classList.remove('hidden');

            const data = await fetchLogisticsData(code);
            if(!data || data.errorCode || data.message === 'failed') {
                btn.disabled = false;
                btn.innerText = "Update Form";
                return;
            }
            const fields = parseData(data);

            document.getElementById('main-content').innerHTML = createShipmentPageHtml(fields, 0);
            btn.disabled = false;
            btn.innerText = "Update Form";
            if(loadingIndicator) loadingIndicator.classList.add('hidden');
        }

        function handleStopBatchFetch(){
            globalVariables.isStoppingBatch = true;

            const loadingIndicator = document.getElementById('loadingFetch');
            const btn = document.getElementById('batchUpdateBtn');
            const stopBtn = document.getElementById('stopBatchBtn');
            toggleModal(false);
            btn.disabled = false;
            btn.innerText = "Update All Forms";
            stopBtn.classList.add('hidden');
            if(loadingIndicator) loadingIndicator.classList.add('hidden');
        }

        async function handleBatchFetch() {
            const codes = document.getElementById('batchCodes').value.split('\n').map(c => c.trim()).filter(c => c);
            if(codes.length === 0) return alert("Enter at least one code");

            globalVariables.isStoppingBatch = false;

            let loadingIndicator = document.getElementById('loadingFetch');
            const btn = document.getElementById('batchUpdateBtn');
            const stopBtn = document.getElementById('stopBatchBtn');
            btn.disabled = true;
            btn.innerText = "Fetching Batch...";
            stopBtn.classList.remove('hidden');
            if(loadingIndicator) loadingIndicator.classList.remove('hidden');


            let html = '';
            // Process in chunks of 4 to avoid long waiting
            const results = await processInChunks(codes, 2, (code) => fetchLogisticsData(code), async (result, code) => {
                if(globalVariables.isStoppingBatch) return; // If stop button is clicked, skip remaining results
                const res = await result;
                loadingIndicator = document.getElementById('loadingFetch');
                if (!res) return;
                const fields = parseData(res);
                if(!html){
                    toggleModal(false);
                }
                html += createShipmentPageHtml(fields, code);
                document.getElementById('main-content').innerHTML = html;
            });

            document.getElementById('main-content').innerHTML = html;

            toggleModal(false);
            btn.disabled = false;
            btn.innerText = "Update All Forms";
            stopBtn.classList.add('hidden');
            globalVariables.isStoppingBatch = false;
            if(loadingIndicator) loadingIndicator.classList.add('hidden');
        }

        function parseData(res) {
            const split = res.dataExcel?.split('\t');
            let volume = (Number(split[6]) || 0).toFixed(3) + '0';
            if (volume.endsWith('.00')) weight = weight.replace('.00', '');
            let weight = (Number(split[6]) || 0).toFixed(1) + '0';
            if (weight.endsWith('.00')) weight = weight.replace('.00', '');
            let priceFromWarehousingRemarks = ''
            if (res.data?.warehousingremarks?.includes('内含')) {
                let numberMatch = res.data.warehousingremarks.match(/内含(\d+)/);
                // if is numeric
                if (numberMatch && numberMatch[1] && !isNaN(numberMatch[1])) {
                    priceFromWarehousingRemarks = ` | ${(Number(numberMatch[1]) * Number(res.data.total)).toFixed(1) + '0'}`;
                }
            }
            let totalPrice = Number(res.data.total).toFixed(1) + '0' + priceFromWarehousingRemarks;
            if (totalPrice.endsWith('.00')) totalPrice = totalPrice.replace('.00', '');
            return {
                container: split[0] || '---',
                customerCode: split[1] || '---',
                itemName: split[4] || '---',
                billNumber: split[2] || '---',
                quantity: split[5] || '0',
                volume: res.data.chargeable_volume || split[7] || '0',
                weight: weight || '0.00',
                totalPrice: totalPrice || '0.00',
                splitting: res.splitting || []
            };
        }

        // Global sync for editable fields within the same shipment page
        document.addEventListener('input', (e) => {
            if (e.target.classList.contains('editable-field')) {
                const field = e.target.getAttribute('data-field');
                const shipmentId = e.target.getAttribute('data-shipment');
                const newValue = e.target.innerText;

                // Only sync fields that belong to the SAME shipment page
                const sameShipmentFields = document.querySelectorAll(`[data-shipment="${shipmentId}"][data-field="${field}"]`);
                sameShipmentFields.forEach(el => {
                    if (el !== e.target) el.innerText = newValue;
                });
            }
        });

        // Paste text from clipboard functionality for shipment code input
        function pasteFromClipboard() {
            navigator.clipboard.readText()
                .then(text => {
                    document.getElementById('shipmentCode').value = text.replace(/[^\d\n]/g, '').trim();
                })
                .catch(err => {
                    console.error('Failed to read clipboard contents: ', err);
                });
        }

        // Initialize with default
        window.onload = handleSingleFetch;
    </script>
</body>
</html>
